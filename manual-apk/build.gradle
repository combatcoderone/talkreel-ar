plugins {
    id 'com.android.application' version '8.13.2'
}

def releaseKeystorePath = System.getenv('TALKREEL_RELEASE_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('TALKREEL_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('TALKREEL_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('TALKREEL_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.talkreel.ar'
    compileSdk 36
    defaultConfig {
        applicationId 'com.talkreel.ar'
        minSdk 26
        targetSdk 36
        versionCode 16
        versionName '0.9.5'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.media3:media3-transformer:1.11.1'
    implementation 'androidx.media3:media3-effect:1.11.1'
    implementation 'androidx.media3:media3-common:1.11.1'
    // Bundled on-device model: no first-launch model download required.
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
