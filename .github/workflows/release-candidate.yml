name: Signed Android release candidate

on:
  workflow_dispatch:
    inputs:
      confirm_release_candidate:
        description: "Build a signed AAB for owner review (does not publish to Google Play)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signed_bundle:
    if: inputs.confirm_release_candidate == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.TALKREEL_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TALKREEL_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TALKREEL_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TALKREEL_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing TALKREEL_RELEASE_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing TALKREEL_RELEASE_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing TALKREEL_RELEASE_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing TALKREEL_RELEASE_KEY_PASSWORD" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore owner-controlled release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TALKREEL_RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/talkreel-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/talkreel-signing/upload-key.jks"
          chmod 600 "$RUNNER_TEMP/talkreel-signing/upload-key.jks"

      - name: Build signed release app bundle
        env:
          TALKREEL_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/talkreel-signing/upload-key.jks
          TALKREEL_RELEASE_STORE_PASSWORD: ${{ secrets.TALKREEL_RELEASE_STORE_PASSWORD }}
          TALKREEL_RELEASE_KEY_ALIAS: ${{ secrets.TALKREEL_RELEASE_KEY_ALIAS }}
          TALKREEL_RELEASE_KEY_PASSWORD: ${{ secrets.TALKREEL_RELEASE_KEY_PASSWORD }}
        run: gradle -p manual-apk --no-daemon bundleRelease

      - name: Verify signed app bundle
        run: |
          AAB="manual-apk/build/outputs/bundle/release/manual-apk-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB"
          sha256sum "$AAB"

      - name: Upload signed app bundle for owner review
        uses: actions/upload-artifact@v4
        with:
          name: talkreel-ar-signed-release-candidate
          path: manual-apk/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
