name: Android APK build

on:
  push:
    branches:
      - main
      - feature/arcore-face-studio
      - feature/presenter-control-ui-v0.8
      - feature/snapchat-style-ar-v0.9
  pull_request:
    branches:
      - main
    paths:
      - 'manual-apk/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Build ARCore-enabled APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK package and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: talkreel-ar-v0.10.0-arcore-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
