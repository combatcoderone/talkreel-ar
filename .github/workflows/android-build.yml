name: Android APK build

on:
  push:
    branches:
      - main
      - feature/presenter-control-ui-v0.8
      - feature/snapchat-style-ar-v0.9
      - feature/advanced-ar-pipeline-v1.0
  pull_request:
    branches:
      - main
    paths:
      - 'manual-apk/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Prepare temporary CI signing key
        working-directory: manual-apk
        run: |
          keytool -genkeypair -noprompt -v \
            -keystore release.keystore \
            -storepass android -keypass android \
            -alias talkreel-ci \
            -dname "CN=TalkReel CI, OU=Build, O=TalkReel, L=Montreal, ST=Quebec, C=CA" \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Build and verify APK
        working-directory: manual-apk
        env:
          TALKREEL_KEYSTORE_PASS: android
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          bash build.sh
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump badging app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: talkreel-ar-v1.0.1-apk
          path: manual-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
